name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Check formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build /warnaserror

      - name: Test
        run: dotnet test --no-build --verbosity normal

  # The WinForms configurator targets net8.0-windows and cannot build on ubuntu/macOS, so it is kept
  # out of CloudPrint.sln and compiled here. This job is the only place its UI shell is verified.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build configurator (WinForms)
        run: dotnet build src/CloudPrint.Configurator/CloudPrint.Configurator.csproj -c Release /warnaserror

      - name: Test
        run: dotnet test --verbosity normal

      # Build the one-file installer: publish the service, embed it into the configurator, publish that
      # as a single self-contained exe, and upload it for manual testing.
      - name: Publish service
        run: >
          dotnet publish src/CloudPrint.Service/CloudPrint.Service.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/service

      - name: Embed service into configurator
        run: Copy-Item out/service/CloudPrint.Service.exe src/CloudPrint.Configurator/CloudPrint.Service.exe -Force

      - name: Publish one-file installer
        run: >
          dotnet publish src/CloudPrint.Configurator/CloudPrint.Configurator.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out/app

      - name: Stage installer artifact
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/app/CloudPrint.Configurator.exe dist/CloudPrint-Setup.exe -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CloudPrint-Setup
          path: dist/CloudPrint-Setup.exe
          retention-days: 7
